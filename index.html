<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja Pleno Variedades</title>
    <link rel="stylesheet" href="/src_css/main.css" />
</head>

<body>
    <header>
        <img src="logo.png" alt="Logo da loja" />
        <h1>Bem-vindo ao Pleno Variedades</h1>
        <p style="margin-top: 30px;">Encontre aqui produtos para o seu dia a dia.</p>
    </header>
    <div id="fundo">
        
    <div id="PainelPrincipal">

            <form class="formLogin" method="post">
                <div class="organizar">
                    <h2>Login</h2>
                    <input type="text" name="nome" placeholder="Digite o nome de usuário" required />
                    <input type="password" name="password" placeholder="Digite sua senha" required />
                    <button type="submit">Entrar</button>
                </div>
            </form>
            
            <form class="formCadastro" method="post">
                <div class="organizar">
                    <h2>Cadastro</h2>
                    <input type="text" name="nome" placeholder="Digite o nome de usuário" required />
                    <input type="email" name="email" placeholder="Digite o email" required />
                    <input type="tel" name="telefone" placeholder="Digite o telefone" required />
                    <input type="password" name="password" placeholder="Digite sua senha" required />  
                    <button type="submit">Cadastrar-se</button>
                </div>
            </form>
        
        </div>
    </div>
    
    <script src="main.js"></script>
</body>

</html>
